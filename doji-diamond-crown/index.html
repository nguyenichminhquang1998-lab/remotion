<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0A0E14;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="35"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="el-01-hook"
        class="scene"
        data-composition-id="01-hook"
        data-composition-src="compositions/frames/01-hook.html"
        data-start="0"
        data-duration="4"
        data-track-index="1"
      ></div>

      <div
        id="el-02-identity"
        class="scene"
        data-composition-id="02-identity"
        data-composition-src="compositions/frames/02-identity.html"
        data-start="4"
        data-duration="5"
        data-track-index="1"
      ></div>

      <div
        id="el-03-stats"
        class="scene"
        data-composition-id="03-stats"
        data-composition-src="compositions/frames/03-stats.html"
        data-start="9"
        data-duration="6"
        data-track-index="1"
      ></div>

      <div
        id="el-04-design"
        class="scene"
        data-composition-id="04-design"
        data-composition-src="compositions/frames/04-design.html"
        data-start="15"
        data-duration="6"
        data-track-index="1"
      ></div>

      <div
        id="el-05-lifestyle"
        class="scene"
        data-composition-id="05-lifestyle"
        data-composition-src="compositions/frames/05-lifestyle.html"
        data-start="21"
        data-duration="6"
        data-track-index="1"
      ></div>

      <div
        id="el-06-close"
        class="scene"
        data-composition-id="06-close"
        data-composition-src="compositions/frames/06-close.html"
        data-start="27"
        data-duration="8"
        data-track-index="1"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
