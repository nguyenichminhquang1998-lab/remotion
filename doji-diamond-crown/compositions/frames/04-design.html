<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="assets/fonts/fonts.css" />
<script src="assets/vendor/gsap.min.js"></script>
<style>
  @font-face { font-family: "Space Grotesk"; font-style: normal; font-weight: 400; src: url("assets/fonts/space-grotesk-400.woff2") format("woff2"); }
  @font-face { font-family: "Space Grotesk"; font-style: normal; font-weight: 500; src: url("assets/fonts/space-grotesk-500.woff2") format("woff2"); }
  @font-face { font-family: "Space Grotesk"; font-style: normal; font-weight: 600; src: url("assets/fonts/space-grotesk-600.woff2") format("woff2"); }
  @font-face { font-family: "Space Grotesk"; font-style: normal; font-weight: 700; src: url("assets/fonts/space-grotesk-700.woff2") format("woff2"); }
  @font-face { font-family: "IBM Plex Mono"; font-style: normal; font-weight: 500; src: url("assets/fonts/ibm-plex-mono-500.woff2") format("woff2"); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #0A0E14; }
  .clip { position: absolute; inset: 0; }
</style>
</head>
<body>
<div id="root" data-composition-id="04-design" data-start="0" data-duration="6" data-width="1080" data-height="1920"
     style="position:relative; width:1080px; height:1920px; overflow:hidden; background:#0A0E14; container-type:size;">

  <div class="clip" data-start="0" data-duration="6" data-track-index="0" style="overflow:hidden;">
    <div class="f4-kb" style="position:absolute; inset:0; background:url('assets/images/04-crown-detail.jpg') center 55% / cover no-repeat;"></div>
    <div style="position:absolute; inset:0; background:linear-gradient(to top, rgba(10,14,20,.93) 0%, rgba(10,14,20,.72) 40%, rgba(10,14,20,.58) 66%, rgba(10,14,20,.44) 100%);"></div>
  </div>

  <div class="clip f4-kicker" data-start="0.3" data-duration="5.7" data-track-index="1" style="inset:auto; top:8%; left:5.5cqw;">
    <div style="display:inline-block; background:rgba(10,14,20,.62); padding:.5cqh 1cqw; font-family:'IBM Plex Mono',monospace; font-weight:500; font-size:1.7cqw; letter-spacing:.14em; text-transform:uppercase; color:#35D6FF;">Diagrid facade</div>
  </div>

  <div class="clip f4-line" data-start="1.0" data-duration="5.0" data-track-index="2" style="inset:auto; left:5.5cqw; top:58%; width:80cqw;">
    <div style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:6.6cqw; line-height:1.3; letter-spacing:-.03em; color:#F3F5F8; text-transform:lowercase;">a diagrid crown, <span style="color:#35D6FF; background:rgba(10,14,20,.5); box-decoration-break:clone; -webkit-box-decoration-break:clone;">rare in asia</span> — designed for this skyline.</div>
  </div>

</div>
<script>
  const tl = gsap.timeline({ paused: true });

  tl.set(".f4-kb", { scale: 1.08, x: 0, y: 0, transformOrigin: "60% 40%" });
  tl.to(".f4-kb", { scale: 1.18, x: -30, y: -26, duration: 6, ease: "none" }, 0);

  tl.fromTo(".f4-kicker", { opacity: 0, y: -6 }, { opacity: 1, y: 0, duration: .35, ease: "expo.out" }, 0.3);
  tl.fromTo(".f4-line", { opacity: 0, y: 18, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: .5, ease: "expo.out" }, 1.0);

  window.__timelines = window.__timelines || {};
  window.__timelines["04-design"] = tl;
  tl.seek(0);
</script>
</body>
</html>
