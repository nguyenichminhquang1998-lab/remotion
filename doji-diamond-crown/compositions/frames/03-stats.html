<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="assets/fonts/fonts.css" />
<script src="assets/vendor/gsap.min.js"></script>
<style>
  @font-face { font-family: "Space Grotesk"; font-style: normal; font-weight: 400; src: url("assets/fonts/space-grotesk-400.woff2") format("woff2"); }
  @font-face { font-family: "Space Grotesk"; font-style: normal; font-weight: 500; src: url("assets/fonts/space-grotesk-500.woff2") format("woff2"); }
  @font-face { font-family: "Space Grotesk"; font-style: normal; font-weight: 600; src: url("assets/fonts/space-grotesk-600.woff2") format("woff2"); }
  @font-face { font-family: "Space Grotesk"; font-style: normal; font-weight: 700; src: url("assets/fonts/space-grotesk-700.woff2") format("woff2"); }
  @font-face { font-family: "IBM Plex Mono"; font-style: normal; font-weight: 500; src: url("assets/fonts/ibm-plex-mono-500.woff2") format("woff2"); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #0A0E14; }
  .clip { position: absolute; inset: 0; }
  .f3-card { position: absolute; left: 5.5cqw; width: 89cqw; border-top: 1px solid #262828; padding-top: 1.6cqh; }
  .f3-num { font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:8.8cqw; line-height:1.05; letter-spacing:-.04em; color:#35D6FF; }
  .f3-label { font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:3cqw; line-height:1.15; letter-spacing:-.01em; color:#F3F5F8; margin-top: 2.2cqh; }
  .f3-note { font-family:'IBM Plex Mono',monospace; font-weight:500; font-size:1.35cqw; letter-spacing:.1em; text-transform:uppercase; color:#7B8388; margin-top: 1.2cqh; }
</style>
</head>
<body>
<div id="root" data-composition-id="03-stats" data-start="0" data-duration="6" data-width="1080" data-height="1920"
     style="position:relative; width:1080px; height:1920px; overflow:hidden; background:#0A0E14; container-type:size;">

  <div class="clip" data-start="0" data-duration="6" data-track-index="0" style="background:#0A0E14;"></div>

  <div class="clip f3-flash" data-start="0" data-duration="0.5" data-track-index="1" style="background:#35D6FF;"></div>

  <div class="clip f3-kicker" data-start="0.15" data-duration="5.85" data-track-index="2" style="inset:auto; top:8%; left:5.5cqw;">
    <div style="font-family:'IBM Plex Mono',monospace; font-weight:500; font-size:1.7cqw; letter-spacing:.14em; text-transform:uppercase; color:#35D6FF;">By the numbers</div>
  </div>

  <div class="clip f3-c1" data-start="0.15" data-duration="5.85" data-track-index="3">
    <div class="f3-card" style="top:20%;">
      <div class="f3-num">186</div>
      <div class="f3-label">meters tall</div>
      <div class="f3-note">Tallest in Hai Phong</div>
    </div>
  </div>

  <div class="clip f3-c2" data-start="2.0" data-duration="4.0" data-track-index="4">
    <div class="f3-card" style="top:42%;">
      <div class="f3-num">45 / 39</div>
      <div class="f3-label">floors</div>
      <div class="f3-note">Hotel tower / residence tower</div>
    </div>
  </div>

  <div class="clip f3-c3" data-start="3.85" data-duration="2.15" data-track-index="5">
    <div class="f3-card" style="top:64%;">
      <div class="f3-num">1.3</div>
      <div class="f3-label">hectares</div>
      <div class="f3-note">Site area</div>
    </div>
  </div>

</div>
<script>
  const tl = gsap.timeline({ paused: true });

  tl.fromTo(".f3-flash", { opacity: 1 }, { opacity: 0, duration: .5, ease: "power1.out" }, 0);

  tl.fromTo(".f3-kicker", { opacity: 0 }, { opacity: 1, duration: .25, ease: "expo.out" }, 0.15);

  tl.fromTo(".f3-c1 .f3-num", { opacity: 0 }, { opacity: 1, duration: .01 }, 0.15);
  tl.fromTo(".f3-c1 .f3-label, .f3-c1 .f3-note", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: .35, ease: "expo.out", stagger: .06 }, 0.22);

  tl.fromTo(".f3-c2 .f3-num", { opacity: 0 }, { opacity: 1, duration: .01 }, 2.0);
  tl.fromTo(".f3-c2 .f3-label, .f3-c2 .f3-note", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: .35, ease: "expo.out", stagger: .06 }, 2.07);

  tl.fromTo(".f3-c3 .f3-num", { opacity: 0 }, { opacity: 1, duration: .01 }, 3.85);
  tl.fromTo(".f3-c3 .f3-label, .f3-c3 .f3-note", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: .35, ease: "expo.out", stagger: .06 }, 3.92);

  window.__timelines = window.__timelines || {};
  window.__timelines["03-stats"] = tl;
  tl.seek(0);
</script>
</body>
</html>
