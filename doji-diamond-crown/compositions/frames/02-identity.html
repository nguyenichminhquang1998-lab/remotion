<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="assets/fonts/fonts.css" />
<script src="assets/vendor/gsap.min.js"></script>
<style>
  @font-face { font-family: "Space Grotesk"; font-style: normal; font-weight: 400; src: url("assets/fonts/space-grotesk-400.woff2") format("woff2"); }
  @font-face { font-family: "Space Grotesk"; font-style: normal; font-weight: 500; src: url("assets/fonts/space-grotesk-500.woff2") format("woff2"); }
  @font-face { font-family: "Space Grotesk"; font-style: normal; font-weight: 600; src: url("assets/fonts/space-grotesk-600.woff2") format("woff2"); }
  @font-face { font-family: "Space Grotesk"; font-style: normal; font-weight: 700; src: url("assets/fonts/space-grotesk-700.woff2") format("woff2"); }
  @font-face { font-family: "IBM Plex Mono"; font-style: normal; font-weight: 500; src: url("assets/fonts/ibm-plex-mono-500.woff2") format("woff2"); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #0A0E14; }
  .clip { position: absolute; inset: 0; }
  .f2-word { display: inline-block; }
</style>
</head>
<body>
<div id="root" data-composition-id="02-identity" data-start="0" data-duration="5" data-width="1080" data-height="1920"
     style="position:relative; width:1080px; height:1920px; overflow:hidden; background:#0A0E14; container-type:size;">

  <div class="clip" data-start="0" data-duration="5" data-track-index="0" style="overflow:hidden;">
    <div class="f2-kb" style="position:absolute; inset:0; background:url('assets/images/03-hero-dusk.jpg') center 38% / cover no-repeat;"></div>
    <div style="position:absolute; inset:0; background:linear-gradient(to top, rgba(10,14,20,.92) 0%, rgba(10,14,20,.65) 42%, rgba(10,14,20,.48) 68%, rgba(10,14,20,.4) 100%);"></div>
  </div>

  <div class="clip f2-kicker" data-start="0.3" data-duration="4.7" data-track-index="1" style="inset:auto; top:8%; right:5.5cqw; text-align:right;">
    <div style="font-family:'IBM Plex Mono',monospace; font-weight:500; font-size:1.7cqw; letter-spacing:.14em; text-transform:uppercase; color:#35D6FF;">Dojiland</div>
  </div>

  <div data-start="1.0" data-duration="4.0" data-track-index="2" class="clip" style="inset:auto; left:5.5cqw; top:62%; width:82cqw;">
    <div style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:5.4cqw; line-height:1.08; letter-spacing:-.02em; color:#F3F5F8; text-transform:lowercase;">
      <span class="f2-word">this</span> <span class="f2-word">is</span> <span class="f2-word">diamond</span> <span class="f2-word">crown</span><br/><span class="f2-word">hai</span> <span class="f2-word">phong.</span>
    </div>
  </div>

</div>
<script>
  const tl = gsap.timeline({ paused: true });

  tl.set(".f2-kb", { scale: 1.0, x: 0, y: 0, transformOrigin: "50% 38%" });
  tl.to(".f2-kb", { scale: 1.08, duration: 5, ease: "none" }, 0);

  tl.fromTo(".f2-kicker", { opacity: 0, y: -6 }, { opacity: 1, y: 0, duration: .35, ease: "expo.out" }, 0.3);
  tl.fromTo(".f2-word", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: .4, ease: "expo.out", stagger: 0.08 }, 1.0);

  window.__timelines = window.__timelines || {};
  window.__timelines["02-identity"] = tl;
  tl.seek(0);
</script>
</body>
</html>
