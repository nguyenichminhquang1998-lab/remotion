<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="assets/fonts/fonts.css" />
<script src="assets/vendor/gsap.min.js"></script>
<style>
  @font-face { font-family: "Space Grotesk"; font-style: normal; font-weight: 400; src: url("assets/fonts/space-grotesk-400.woff2") format("woff2"); }
  @font-face { font-family: "Space Grotesk"; font-style: normal; font-weight: 500; src: url("assets/fonts/space-grotesk-500.woff2") format("woff2"); }
  @font-face { font-family: "Space Grotesk"; font-style: normal; font-weight: 600; src: url("assets/fonts/space-grotesk-600.woff2") format("woff2"); }
  @font-face { font-family: "Space Grotesk"; font-style: normal; font-weight: 700; src: url("assets/fonts/space-grotesk-700.woff2") format("woff2"); }
  @font-face { font-family: "IBM Plex Mono"; font-style: normal; font-weight: 500; src: url("assets/fonts/ibm-plex-mono-500.woff2") format("woff2"); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #0A0E14; }
  .clip { position: absolute; inset: 0; }
</style>
</head>
<body>
<div id="root" data-composition-id="01-hook" data-start="0" data-duration="4" data-width="1080" data-height="1920"
     style="position:relative; width:1080px; height:1920px; overflow:hidden; background:#0A0E14; container-type:size;">

  <div class="clip" data-start="0" data-duration="4" data-track-index="0" style="overflow:hidden;">
    <div class="f1-kb" style="position:absolute; inset:0; background:url('assets/images/01-aerial-night.jpg') center 42% / cover no-repeat;"></div>
    <div style="position:absolute; inset:0; background:linear-gradient(to top, rgba(10,14,20,.95) 0%, rgba(10,14,20,.72) 38%, rgba(10,14,20,.55) 62%, rgba(10,14,20,.42) 100%);"></div>
  </div>

  <div class="clip f1-kicker" data-start="0.1" data-duration="3.9" data-track-index="1" style="inset:auto; top:8%; left:5.5cqw;">
    <div style="display:inline-block; background:rgba(10,14,20,.62); padding:.5cqh 1cqw; font-family:'IBM Plex Mono',monospace; font-weight:500; font-size:1.7cqw; letter-spacing:.14em; text-transform:uppercase; color:#35D6FF;">Hai Phong, Vietnam</div>
  </div>

  <div class="clip f1-line" data-start="0.8" data-duration="3.2" data-track-index="2" style="inset:auto; left:5.5cqw; top:44%; width:82cqw;">
    <div style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:8.4cqw; line-height:.96; letter-spacing:-.03em; color:#F3F5F8; text-transform:lowercase;">hai phong doesn't wait for the future.</div>
  </div>

</div>
<script>
  const tl = gsap.timeline({ paused: true });

  tl.set(".f1-kb", { scale: 1.06, x: 0, y: 0, transformOrigin: "50% 42%" });
  tl.to(".f1-kb", { scale: 1.16, x: -22, y: -18, duration: 4, ease: "none" }, 0);

  tl.fromTo(".f1-kicker", { opacity: 0, y: -6 }, { opacity: 1, y: 0, duration: .35, ease: "expo.out" }, 0.1);
  tl.fromTo(".f1-line", { opacity: 0, y: 20, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: .5, ease: "expo.out" }, 0.8);

  window.__timelines = window.__timelines || {};
  window.__timelines["01-hook"] = tl;
  tl.seek(0);
</script>
</body>
</html>
