<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="./vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Anton";
        src: url("./vendor/fonts/anton-400.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: "Archivo";
        src: url("./vendor/fonts/archivo-600.woff2") format("woff2");
        font-weight: 600;
        font-style: normal;
        font-display: block;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: transparent;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        background: transparent;
      }
      .clip {
        position: absolute;
        inset: 0;
      }
      .scene-content {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        padding: 120px 160px;
        box-sizing: border-box;
      }

      /* 3D stage: perspective lives on the static parent, rotation on the moving child */
      .stage-3d {
        perspective: 1400px;
      }

      .lockup {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 22px;
        transform-style: preserve-3d;
        backface-visibility: hidden;
        will-change: transform;
      }

      .line-b16 {
        font-family: "Anton", sans-serif;
        font-size: 260px;
        line-height: 0.85;
        color: #0a0a0a;
        letter-spacing: 0.01em;
      }

      .line-sub {
        font-family: "Archivo", sans-serif;
        font-weight: 600;
        font-size: 52px;
        letter-spacing: 0.55em;
        color: #0a0a0a;
        /* large letter-spacing adds trailing space after the last glyph;
           shift back by half a unit so the block stays visually centered */
        transform: translateX(0.275em);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="4"
      data-width="1920"
      data-height="1080"
    >
      <div id="spin-reveal" class="clip" data-start="0" data-duration="4" data-track-index="0">
        <div class="scene-content">
          <div class="stage-3d">
            <div class="lockup" id="lockup">
              <div class="line-b16" id="b16-word">B16</div>
              <div class="line-sub">DANCE STUDIO</div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // safe resting state for any seek before the first tween runs
      // (two fromTo calls share a target; GSAP applies 'from' values at authoring
      // time, so without this the last-authored fromTo would win pre-seek).
      // gsap.set() runs immediately, outside the timeline, so frame 0 shows it
      // even with the playhead sitting exactly at t=0 (a tl.set(...,0) would not).
      gsap.set("#lockup", { opacity: 0, scale: 0.9, rotationY: 0 });

      // entrance — soft fade/scale in so the spin doesn't pop from nothing
      tl.fromTo("#lockup", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.25, ease: "power2.out", immediateRender: false }, 0);

      // signature move: two full turns around the vertical axis, in place,
      // decelerating into a forward-facing hold — the beat at 2.5s
      tl.fromTo("#lockup", { rotationY: 0 }, { rotationY: 720, duration: 2.5, ease: "power3.out", immediateRender: false }, 0);

      // landing punch on the beat — a small settle, no color/glow (monochrome, motion-only)
      tl.to("#lockup", { scale: 1.05, duration: 0.15, ease: "sine.out", yoyo: true, repeat: 1 }, 2.5);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
