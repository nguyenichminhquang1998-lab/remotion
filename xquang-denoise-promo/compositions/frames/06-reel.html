  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var $ = function (id) { return document.getElementById("f06-reel-" + id); };
      var tl = gsap.timeline({ paused: true });
      var DUR = 5.0;
      var CUTS = [0.0, 1.6, 3.2];
      var ENDS = [1.6, 3.2, 5.0];

      // slow push under the hard cuts (element scale, camera-locked feel)
      tl.fromTo($("stage"), { scale: 1.0 }, { scale: 1.03, duration: DUR, ease: "none" }, 0);

      // initial states — seek-safe via set at t=0
      tl.set([$("e2"), $("e3")], { autoAlpha: 0 }, 0);
      tl.set($("e1"), { autoAlpha: 1 }, 0);
      tl.set([$("f1"), $("f2"), $("f3")], { scaleX: 0 }, 0);

      for (var i = 0; i < 3; i++) {
        var k = i + 1;
        var t = CUTS[i];

        // hard cut: previous page gone, next page on — instant, no fade
        if (i > 0) {
          tl.set($("e" + i), { autoAlpha: 0 }, t);
          tl.set($("e" + k), { autoAlpha: 1 }, t);
          tl.set($("f" + i), { scaleX: 1 }, t);
        }

        // page counter steps: active numeral in brass
        tl.set($("n" + k), { opacity: 1, color: "#8A6A3C" }, t);
        if (i > 0) tl.set($("n" + i), { opacity: 0.28, color: "#EDEAE4" }, t);

        // page flip: slate snaps in from a small x offset
        tl.fromTo($("s" + k), { x: 28 }, { x: 0, duration: 0.18, ease: "power3.out" }, t);
        // title: very short rise (<= 0.25s) so the cut reads as a flip
        tl.fromTo($("t" + k), { y: 56, opacity: 0.4 }, { y: 0, opacity: 1, duration: 0.24, ease: "power3.out" }, t);
        // role line lands just behind the title
        tl.fromTo($("r" + k), { y: 18, opacity: 0 }, { y: 0, opacity: 1, duration: 0.22, ease: "power2.out" }, t + 0.1);

        // progress segment fills across the page's window
        tl.fromTo($("f" + k), { scaleX: 0 }, { scaleX: 1, duration: ENDS[i] - t - (i === 2 ? 0.6 : 0), ease: "none" }, t);
      }

      window.__timelines["06-reel"] = tl;
