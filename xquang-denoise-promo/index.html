<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0E0D0C;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #grain-root {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        z-index: 50;
      }
      #grain-root .grain-tex {
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        opacity: 0.09;
      }
      #grain-root .scratch {
        position: absolute;
        top: 0;
        width: 1px;
        height: 100%;
        background: #EDEAE4;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="47"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="el-01-hook"
        class="scene"
        data-composition-id="01-hook"
        data-composition-src="compositions/frames/01-hook.html"
        data-start="0"
        data-duration="4.4"
        data-track-index="0"
      ></div>

      <div
        id="el-02-intro"
        class="scene"
        data-composition-id="02-intro"
        data-composition-src="compositions/frames/02-intro.html"
        data-start="4"
        data-duration="4.5"
        data-track-index="1"
      ></div>

      <div
        id="el-03-one-contact"
        class="scene"
        data-composition-id="03-one-contact"
        data-composition-src="compositions/frames/03-one-contact.html"
        data-start="8"
        data-duration="6.4"
        data-track-index="0"
      ></div>

      <div
        id="el-04-pullupinmymind"
        class="scene"
        data-composition-id="04-pullupinmymind"
        data-composition-src="compositions/frames/04-pullupinmymind.html"
        data-start="14"
        data-duration="7.5"
        data-track-index="1"
      ></div>

      <div
        id="el-05-orpc"
        class="scene"
        data-composition-id="05-orpc"
        data-composition-src="compositions/frames/05-orpc.html"
        data-start="21"
        data-duration="4.5"
        data-track-index="0"
      ></div>

      <div
        id="el-06-reel"
        class="scene"
        data-composition-id="06-reel"
        data-composition-src="compositions/frames/06-reel.html"
        data-start="25"
        data-duration="5.5"
        data-track-index="1"
      ></div>

      <div
        id="el-07-process"
        class="scene"
        data-composition-id="07-process"
        data-composition-src="compositions/frames/07-process.html"
        data-start="30"
        data-duration="6.5"
        data-track-index="0"
      ></div>

      <div
        id="el-08-clients"
        class="scene"
        data-composition-id="08-clients"
        data-composition-src="compositions/frames/08-clients.html"
        data-start="36"
        data-duration="4.4"
        data-track-index="1"
      ></div>

      <div
        id="el-09-cta"
        class="scene"
        data-composition-id="09-cta"
        data-composition-src="compositions/frames/09-cta.html"
        data-start="40"
        data-duration="7"
        data-track-index="0"
      ></div>

      <div id="grain-root" class="clip" data-start="0" data-duration="47" data-track-index="5">
        <div class="grain-tex" id="grain-tex"></div>
        <div class="scratch" id="scratch-a"></div>
        <div class="scratch" id="scratch-b"></div>
      </div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-hook", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 4);
        tl.fromTo("#el-02-intro", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 4);
        tl.to("#el-02-intro", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 8);
        tl.fromTo("#el-03-one-contact", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 8);
        tl.to("#el-03-one-contact", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 14);
        tl.fromTo("#el-04-pullupinmymind", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 14);
        tl.to("#el-04-pullupinmymind", { x: -1080, duration: 0.5, ease: "power3.inOut" }, 21);
        tl.fromTo("#el-05-orpc", { x: 1080, opacity: 1 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.inOut" }, 21);
        tl.to("#el-05-orpc", { x: -1080, duration: 0.5, ease: "power3.inOut" }, 25);
        tl.fromTo("#el-06-reel", { x: 1080, opacity: 1 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.inOut" }, 25);
        tl.to("#el-06-reel", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 30);
        tl.fromTo("#el-07-process", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 30);
        tl.to("#el-07-process", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 36);
        tl.fromTo("#el-08-clients", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 36);
        tl.to("#el-08-clients", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 40);
        tl.fromTo("#el-09-cta", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 40);
        // film grain + scratches — stepped 12x/s from a fixed LCG sequence (deterministic, seek-safe)
        (function () {
          var seed = 1337;
          function rnd() { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; }
          var steps = 47 * 12;
          for (var i = 0; i < steps; i++) {
            var t = i / 12;
            tl.set("#grain-tex", { x: Math.round((rnd() - 0.5) * 300), y: Math.round((rnd() - 0.5) * 500) }, t);
            var a = rnd(), b = rnd();
            tl.set("#scratch-a", { left: Math.round(a * 1080), opacity: a < 0.12 ? 0.14 : 0 }, t);
            tl.set("#scratch-b", { left: Math.round(b * 1080), opacity: b < 0.06 ? 0.1 : 0 }, t);
          }
        })();
        tl.to({}, { duration: 47 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
